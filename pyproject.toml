[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ag-trace"
dynamic = ["version"]
description = "See exactly what your AI agent did — every tool call, LLM request, file touch, and decision."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Rudraksh Sisodia", email = "rudrakshsisodia@gmail.com" }
]
keywords = ["ai", "agents", "observability", "tracing", "mcp", "llm", "claude", "tool-calls", "debugging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]

[project.scripts]
ag-trace = "agent_trace.cli:main"
agent-strace = "agent_trace.cli:main"

[project.urls]
Homepage = "https://github.com/rudrakshsisodia/ag-trace"
Repository = "https://github.com/rudrakshsisodia/ag-trace"
Issues = "https://github.com/rudrakshsisodia/ag-trace/issues"

[tool.hatch.version]
path = "src/agent_trace/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_trace"]
